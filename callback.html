<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikTok Auth – Luxury Mindset Scheduler</title>
  <style>
    body { font-family: Georgia, serif; max-width: 600px; margin: 80px auto; padding: 0 24px; color: #1a1a1a; text-align: center; }
    h1 { color: #b8963c; }
    .code-box { background: #e8f5e9; border: 2px solid #4caf50; border-radius: 8px; padding: 20px; margin: 24px 0; word-break: break-all; font-family: monospace; font-size: 1.1rem; color: #1b5e20; }
    .error-box { background: #ffeaea; border: 2px solid #f44336; border-radius: 8px; padding: 20px; margin: 24px 0; color: #b71c1c; }
    p { color: #555; line-height: 1.8; }
    .label { font-size: 0.85rem; color: #888; margin-bottom: 6px; }
  </style>
</head>
<body>
  <h1>✅ TikTok Authorization</h1>
  <div id="output"></div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const error = params.get('error');
    const output = document.getElementById('output');

    if (code) {
      output.innerHTML = `
        <p>Authorization successful! Copy the code below and paste it into your terminal.</p>
        <div class="label">Your authorization code:</div>
        <div class="code-box" id="code-text">${code}</div>
        <p><small>Paste this into the terminal when it asks: <em>"Paste just the 'code' value"</em></small></p>
      `;
    } else if (error) {
      output.innerHTML = `<div class="error-box"><strong>Error:</strong> ${error}<br>${params.get('error_description') || ''}</div>`;
    } else {
      output.innerHTML = `<p style="color:#888;">No authorization code found in URL. This page is used as the TikTok OAuth redirect for Luxury Mindset Scheduler.</p>`;
    }
  </script>
</body>
</html>
